# Phase A scan pipeline for six_hours_round_4 (DESIGN §10.3).
#
# Existing convmaps only — no dense-angle / membrane re-run. Sparse csv candidates + the dense
# `cc` field feed a gold/ice cluster constraint (dense cc) and a surface-coherence constraint
# (SPARSE csv normals, CC-gated). Per-tomo BackgroundModel calibration makes the absolute cc
# thresholds portable (§9.2). GoldFiducialProximity contributes only where a bead model exists.
#
# `features` are FEATURE_REGISTRY names (the extractors run once per tomo); `constraints` are
# CONSTRAINT_REGISTRY names. Both are instantiated from these stanzas (DESIGN §3 registry+YAML).

dataset: full_enchilada_3_4
device: cpu

# Per-tomo background fit ("mad" | "truncated" | "none"); folds bg_mean/bg_std into every BlockCtx.
meta:
  calibrate: mad

candidate_source: csv_peaks

features:
  - {name: score_cluster_density, radius: 2}
  - {name: blobness, step: 2}
  - {name: gold_fiducial_proximity, near_A: 250}
  # radius_A=800 (NOT ~300): the sparse csv peaks are NMS-separated by the rotated ~[210,210,320] A
  # erase cylinder, so at ~300 A ~44% of real peaks have ZERO neighbors and the coherence/curvature
  # terms are inert (median 1 neighbor, 99% underdetermined quadric on H99_2_100). 800 A -> ~2%
  # isolated, median 11 neighbors, so the surface discriminator actually discriminates.
  - {name: normal_coherence, radius_A: 800, normal_source: auto}
  - {name: surface_fit_residual, radius_A: 800, normal_source: auto}
  - {name: principal_curvature, radius_A: 800, normal_source: auto}
  # Isolation features feed the isolation constraint below (catches the isolated off-surface FPs
  # that surface_coherence cannot score — an isolated hit is forced coherence=1.0).
  - {name: neighbor_density, radius_A: 800}
  - {name: off_surface_isolation, radius_A: 800, min_neighbors: 4}

constraints:
  # Gold/ice = compact clusters of extreme CC (SPEC §1). cc_thresh is in per-tomo background
  # sigmas (BackgroundModel z of the local CC mean); cc_cluster_z >~6 is the extreme-CC tail.
  - name: gold_ice_cluster
    cc_thresh: 6.0
    cc_sharpness: 2.0
    blob_mix: 0.3
    gold_radius_A: 250.0
  # Incoherent-normal neighborhoods (SPEC §4). coh_thresh low so a coherent membrane hit scores
  # ~0 and only a clearly incoherent neighborhood (argmax-of-noise) is penalized.
  - name: surface_coherence
    coh_thresh: 0.35
    coh_sharpness: 12.0
    residual_weight: 0.5
    curv_weight: 0.2
  # Isolation prior (soft, weak): an isolated / off-surface hit is a false-positive signal. This
  # is the ONLY term that scores the ~2-8% isolated hits (surface_coherence forces coherence=1.0
  # for a neighbor-less hit, so it gives them zero penalty). off_thresh_A ~ one erase half-length.
  - name: isolation
    density_thresh: 2.0
    density_sharpness: 1.0
    off_thresh_A: 300.0
    off_sharpness: 0.03
    off_weight: 1.0

# Fusion head: uniform -1 weight (FP score lowers keep-prob) + a positive bias so a clean,
# coherent, low-CC hit keeps and only the gold/ice-cluster OR incoherent-normal tail is flagged.
combiner:
  weight: -1.0
  bias: 0.5

tau: 0.5

writeback:
  debug_csv: true
  removal_json: true
