# Phase C MEMBRANE-geometry scan for six_hours_round_4 (DESIGN §5, §7; SPEC §8).
#
# Adds the membrane-reference geometry on top of the round_4 recipe to separate genuine
# outer-mitochondrial-membrane targets (template +Z = outward normal) from false positives that
# sit on the WRONG side of a membrane lattice or on small INTERIOR replication vesicles.
#
# No membrane search and no manual trace are required: MembraneDistanceProvider segments membrane
# sheets straight from the tomogram reconstruction `rec` by Hessian sheetness
# (fields/derived.py:hessian_membraneness -> membrane_segmentation), takes the signed EDT
# (negative inside a closed membrane), and the four membrane features sample it:
#   membrane_distance   -> signed distance to the nearest membrane (Angstrom)
#   inside_outside_sign -> -1 inside a closed membrane / +1 outside  (interior-vesicle signal)
#   closed_shell_score  -> |Laplacian(SDF)| curvature; high for a small vesicle, ~0 for the OMM
#   membrane_facing     -> cos(template +Z, membrane outward normal); ~0.9 on the outer membrane,
#                          ~0.5 on small interior shells (validated on H99_2_100_1_bin5)
#
# The `rec` field is loaded from the per-host alt_cache; membrane_sdf is a DERIVE (Hessian +
# signed EDT, ~90 s / tomo full-res, content-addressed cached). Where `rec` is absent for a tomo
# the membrane features go neutral and the constraint contributes nothing (DESIGN §5).

dataset: full_enchilada_3_4
device: cpu

# The searched reconstruction the membrane is segmented from (per-host alt_cache, DESIGN §5).
rec_dir: /scratch/salina/alt_cache

meta:
  calibrate: mad

candidate_source: csv_peaks

features:
  # --- round_4 base features (unchanged) ---
  - {name: score_cluster_density, radius: 2}
  - {name: blobness, step: 2}
  - {name: gold_fiducial_proximity, near_A: 250}
  - {name: normal_coherence, radius_A: 800, normal_source: auto}
  - {name: surface_fit_residual, radius_A: 800, normal_source: auto}
  - {name: principal_curvature, radius_A: 800, normal_source: auto}
  - {name: neighbor_density, radius_A: 800}
  - {name: off_surface_isolation, radius_A: 800, min_neighbors: 4}
  # --- membrane geometry (DESIGN §7; consume membrane_sdf derived from rec) ---
  - {name: membrane_distance}
  - {name: inside_outside_sign}
  - {name: closed_shell_score, step: 2}
  - {name: membrane_facing, step: 2}

constraints:
  - name: gold_ice_cluster
    cc_thresh: 6.0
    cc_sharpness: 2.0
    blob_mix: 0.3
    gold_radius_A: 250.0
  - name: surface_coherence
    coh_thresh: 0.35
    coh_sharpness: 12.0
    residual_weight: 0.5
    curv_weight: 0.2
  - name: isolation
    density_thresh: 2.0
    density_sharpness: 1.0
    off_thresh_A: 300.0
    off_sharpness: 0.03
    off_weight: 1.0
  # Membrane geometry. shell_A ~ 75 A (6 bin5 voxels) counts a hit as on-membrane; fp_side=-1
  # makes the INSIDE of a closed membrane the false-positive side (interior vesicles). misface_*
  # penalizes on-membrane hits whose template +Z disagrees with the local membrane outward normal
  # (the strongest per-hit outer-vs-interior discriminator on the real data); misface_weight>0
  # switches it on (default 0.0 = off until the joint tune sets it). vesicle_weight leans on
  # closed_shell curvature — weak/noisy at hit positions on the fragmented real segmentation, so
  # it is down-weighted; the connected-component geometry is the reliable closed-shell test.
  - name: membrane_geometry
    shell_A: 75.0
    dist_sharpness: 0.05
    wrong_side_weight: 0.5
    fp_side: -1.0
    closed_thresh: 0.01
    closed_sharpness: 200.0
    vesicle_weight: 0.25
    misface_thresh: 0.7
    misface_sharpness: 5.0
    misface_weight: 0.5

combiner:
  weight: -1.0
  bias: 0.5

tau: 0.5

writeback:
  debug_csv: true
  removal_json: true
