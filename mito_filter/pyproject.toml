[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mito_filter"
version = "0.1.0"
description = "Cryo-ET template-matching false-positive spatial/orientation filter (mito_filter)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "ClearNoise" }]
dependencies = [
    "numpy",
    "scipy",
    "mrcfile",
    "pyyaml",
    "typing-extensions",
    "pandas",
    "pyarrow",
    "optuna",
    "scikit-learn",
    "scikit-image",
    "h5py",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x", "torch"]
dev = ["black", "isort", "flake8", "mypy", "pytest", "pytest-cov"]

[project.scripts]
mito-filter = "mito_filter.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mito_filter = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
